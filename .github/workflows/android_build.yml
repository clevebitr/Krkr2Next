name: Android 构建

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（debug / release）'
        type: choice
        default: debug
        options:
          - debug
          - release
      enable_render_probe:
        description: '开启统一诊断探针总开关（默认关闭，见 docs/dev/probes.md）'
        type: boolean
        default: false
      log_level:
        description: '引擎日志级别（auto=按构建类型：release→info，debug→debug）'
        type: choice
        default: auto
        options:
          - auto
          - trace
          - debug
          - info
          - warn
          - err
          - critical
          - off
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 锁 NDK 27：托管 runner 预装更新的 NDK，而 libffi:arm64-android 在 NDK 29 下
  # 交叉编译失败。这里显式指定，避免 sdkmanager 装到不兼容版本。
  NDK_VERSION: '27.0.12077973'
  JOBS: 4

jobs:
  # ── 引擎：先出 libengine_api.so 并做符号断言 ──────────────────────────────
  # 独立成 job 是为了让引擎侧问题（符号缺失、依赖错、残留 ANGLE）在 Gradle
  # 之前就失败，反馈更快，也避免把 Gradle 的问题和引擎的问题混在一起。
  engine-build:
    name: 构建引擎 (libengine_api.so)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TYPE: ${{ inputs.build_type != '' && inputs.build_type || 'debug' }}
      ENABLE_RENDER_PROBE: ${{ inputs.enable_render_probe != '' && inputs.enable_render_probe || 'false' }}
      KRKR_LOG_LEVEL: ${{ inputs.log_level != '' && inputs.log_level || 'auto' }}

    steps:
      - uses: actions/checkout@v4

      - name: 校验 Kotlin ↔ C++ 的 JNI 符号一致
        # 不需要 NDK，纯静态检查，先跑——这类不一致只在运行时暴露
        run: python3 scripts/check_jni_symbols.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装构建依赖
        run: |
          # runner 预装的 chrome apt 源与本次构建无关，且其 dl.google.com CDN
          # 偶发 Hash Sum mismatch 会让 apt-get update 退出 100 拖垮整个 workflow。
          # 按内容删除所有指向 dl.google.com 的源，只保留 ubuntu 官方源。
          sudo grep -rIl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null | \
            xargs -r sudo rm -f
          sudo apt-get update -o Acquire::Retries=3 || true
          # autoconf/automake/libtool：vcpkg 的 autotools 端口需要宿主 autoreconf
          sudo apt-get install -y cmake ninja-build ccache autoconf automake libtool
          cmake --version | head -1
          ninja --version

      - name: 安装 Android NDK ${{ env.NDK_VERSION }}
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            SDKMGR=""
            for c in "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager \
                     "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
                     "$ANDROID_HOME"/tools/bin/sdkmanager; do
              if [ -x "$c" ]; then SDKMGR="$c"; break; fi
            done
            [ -n "$SDKMGR" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "ndk;$NDK_VERSION"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_HOME/ndk/$NDK_VERSION"

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-engine-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-engine-${{ github.ref }}-
            ccache-engine-

      - name: 恢复 vcpkg 二进制缓存
        # key 含 manifest / overlay port / triplet / 构建类型，任一变化即失效重建。
        # vcpkg 本体钉在固定 commit（见 scripts/build_engine_android.sh），
        # ABI 稳定缓存才真正复用。
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/**') }}-${{ env.BUILD_TYPE }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: 构建引擎
        env:
          VCPKG_BINARY_SOURCES: clear;files,$HOME/.cache/vcpkg,readwrite
        run: ./build.sh "$BUILD_TYPE" --engine-only

      - name: 校验 libengine_api.so
        run: scripts/verify_engine_so.sh "out/android/$BUILD_TYPE/bridge/engine_api/libengine_api.so" "$ANDROID_NDK_HOME"

      - name: 记录体积
        run: |
          SO="out/android/$BUILD_TYPE/bridge/engine_api/libengine_api.so"
          ls -lh "$SO"
          echo "engine_so_bytes=$(stat -c%s "$SO")" >> "$GITHUB_OUTPUT"
        id: size

      - name: 上传引擎产物
        uses: actions/upload-artifact@v4
        with:
          name: libengine_api-${{ env.BUILD_TYPE }}
          path: out/android/${{ env.BUILD_TYPE }}/bridge/engine_api/libengine_api.so
          if-no-files-found: error

  # ── APK：把引擎产物放进 jniLibs 后由 Gradle 打包 ──────────────────────────
  android-package:
    name: 打包 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: engine-build
    env:
      BUILD_TYPE: ${{ inputs.build_type != '' && inputs.build_type || 'debug' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 下载引擎产物
        uses: actions/download-artifact@v4
        with:
          name: libengine_api-${{ env.BUILD_TYPE }}
          path: app/app/src/main/jniLibs/arm64-v8a/

      - name: 生成 Gradle wrapper（若仓库未含 jar）
        working-directory: app
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            # gradle-wrapper.jar 是二进制，未入库；用本机 gradle 生成一次
            sudo apt-get update -o Acquire::Retries=3 || true
            sudo apt-get install -y unzip
            GRADLE_VER="$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)"
            curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-${GRADLE_VER}/bin/gradle wrapper --gradle-version "$GRADLE_VER"
          fi
          chmod +x gradlew

      - name: 构建 APK
        working-directory: app
        run: ./gradlew --no-daemon ":app:assemble$([ "$BUILD_TYPE" = release ] && echo Release || echo Debug)"

      - name: 校验 APK 内含引擎库
        run: |
          APK="$(find app/app/build/outputs/apk -name '*.apk' | head -n1)"
          [ -n "$APK" ] || { echo "::error::未产出 APK"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libengine_api.so' || {
            echo "::error::APK 中缺少 lib/arm64-v8a/libengine_api.so"; exit 1; }
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: KiriNext-apk-${{ env.BUILD_TYPE }}
          path: app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
