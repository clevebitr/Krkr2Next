name: Android 构建

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（debug / release）'
        type: choice
        default: debug
        options:
          - debug
          - release
      enable_render_probe:
        description: '开启统一诊断探针总开关（默认关闭）'
        type: boolean
        default: false
      log_level:
        description: '引擎日志级别（auto=按构建类型：release→info，debug→debug）'
        type: choice
        default: auto
        options:
          - auto
          - trace
          - debug
          - info
          - warn
          - err
          - critical
          - off
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 锁 NDK 27：托管 runner 预装更新的 NDK，而 libffi:arm64-android 在 NDK 29 下
  # 交叉编译失败。这里显式指定，避免 sdkmanager 装到不兼容版本。
  NDK_VERSION: '27.0.12077973'
  JOBS: 4

jobs:
  # ── 引擎：先出 libengine_api.so 并做符号断言 ──────────────────────────────
  # 独立成 job 是为了让引擎侧问题（符号缺失、依赖错、残留 ANGLE）在 Gradle
  # 之前就失败，反馈更快，也避免把 Gradle 的问题和引擎的问题混在一起。
  engine-build:
    name: 构建引擎 (libengine_api.so)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TYPE: ${{ inputs.build_type != '' && inputs.build_type || 'debug' }}
      ENABLE_RENDER_PROBE: ${{ inputs.enable_render_probe != '' && inputs.enable_render_probe || 'false' }}
      KRKR_LOG_LEVEL: ${{ inputs.log_level != '' && inputs.log_level || 'auto' }}

    steps:
      - uses: actions/checkout@v4

      - name: 还原 Live2D Cubism SDK
        # SDK 是专有构件，README「硬约束 6」要求不入库（cpp/plugins/cubism/{Framework,
        # Core/lib} 已 gitignore），所以 CI 机器上默认没有它——而缺了它不会让构建失败，
        # 只会让产出的 APK 没有 Live2D，真机上表现为 krkrlive2d.dll Failed、全动画作品黑屏。
        #
        # 本步骤把来源收敛成一个入口：配了 secret 就还原并**断言之**，没配就明确警告后继续
        # （不得阻断核心构建）。三个 secret 都是可选的：
        #   CUBISM_SDK_GH     私有仓库 owner/repo（SDK 以 release asset 存放）
        #   CUBISM_SDK_TOKEN  该私有仓库只读 contents 的 fine-grained PAT
        #   CUBISM_SDK_ASSET  asset 文件匹配，缺省 cubism*.zip
        # 也可以用 CUBISM_SDK_URL 指向自建主机的直链，见 scripts/restore_cubism_sdk.sh。
        id: cubism
        env:
          CUBISM_SDK_GH: ${{ secrets.CUBISM_SDK_GH }}
          CUBISM_SDK_TOKEN: ${{ secrets.CUBISM_SDK_TOKEN }}
          CUBISM_SDK_ASSET: ${{ secrets.CUBISM_SDK_ASSET }}
          CUBISM_SDK_SHA256: ${{ secrets.CUBISM_SDK_SHA256 }}
        run: |
          bash scripts/restore_cubism_sdk.sh
          # 输出按**还原后的实际文件**判定，不看脚本退出码：脚本在"未配置来源"时
          # 是成功退出的，那种情况必须让后面的校验知道 Live2D 并不存在。
          if [[ -f cpp/plugins/cubism/Framework/CubismFramework.hpp ]] \
             && [[ -n "$(find cpp/plugins/cubism/Core/lib -name 'libLive2DCubismCore.a' -print -quit 2>/dev/null)" ]]; then
            echo "live2d=1" >> "$GITHUB_OUTPUT"
          else
            echo "live2d=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 静态检查
        # JNI 符号一致性 / 移植溯源漂移 / 本地语法检查。都不需要 NDK，
        # 秒级出结果，因此放在最前面——这类问题（符号不一致、断言写错）
        # 只在运行时暴露，让它们在编译之前就失败。
        run: bash scripts/check_static.sh

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装构建依赖
        # autoconf/automake/libtool：vcpkg 的 autotools 端口需要宿主 autoreconf
        # bison：tjs2 构建期由 .y 生成 parser（cpp/core/tjs2/CMakeLists.txt）
        # nasm / yasm：vcpkg 交叉编译时的 **x64-linux 宿主** ffmpeg 3.3.9 需要。
        #   yasm 优先——apt 的 nasm 2.15 生成的 .d 依赖会把 %include 写成裸文件名，
        #   导致 "No rule to make target 'vp9itxfm_template.asm'"；yasm 生成正确路径。
        #   两个都装：缺 nasm 时 vcpkg 会直接报
        #   "Could not find nasm. Please install it via your package manager"。
        # libomp-dev：OpenCV 的 CMake 配置会 find_dependency(OpenMP)。宿主的
        #   opencv4 一旦出现在 vcpkg_installed/x64-linux 下就会被 find_package
        #   搜到，而它的依赖检查需要 C 语言的 OpenMP。CMake 用 clang 时靠 libomp，
        #   不装就会报 "Could NOT find OpenMP_C (missing: OpenMP_C_FLAGS
        #   OpenMP_C_LIB_NAMES)"。
        run: |
          # runner 预装的 chrome apt 源与本次构建无关，且其 dl.google.com CDN
          # 偶发 Hash Sum mismatch 会让 apt-get update 退出 100 拖垮整个 workflow。
          # 按内容删除所有指向 dl.google.com 的源，只保留 ubuntu 官方源。
          sudo grep -rIl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null | \
            xargs -r sudo rm -f
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y \
            cmake ninja-build ccache autoconf automake libtool \
            bison nasm yasm libomp-dev
          # 逐个回显版本与绝对路径：缺工具时 CMake/vcpkg 的报错往往含糊
          # （如 "CMAKE_MAKE_PROGRAM is not set"），先在这里暴露更省时间。
          cmake --version | head -1
          ninja --version
          echo "ninja: $(command -v ninja)"
          bison --version | head -1
          nasm -v
          yasm --version | head -1
          echo "libomp: $(ls /usr/lib/llvm-*/lib/libomp.so 2>/dev/null || \
                          ls /usr/lib/x86_64-linux-gnu/libomp.so 2>/dev/null || \
                          echo '未找到')"

      - name: 安装 Android NDK ${{ env.NDK_VERSION }}
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            SDKMGR=""
            for c in "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager \
                     "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
                     "$ANDROID_HOME"/tools/bin/sdkmanager; do
              if [ -x "$c" ]; then SDKMGR="$c"; break; fi
            done
            [ -n "$SDKMGR" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "ndk;$NDK_VERSION"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_HOME/ndk/$NDK_VERSION"

      # 缓存必须用 restore/save 分离 + save 加 if: always()。
      #
      # 合并式的 actions/cache@v4 把保存放在 job 末尾的 post 步骤，而那一步只在
      # **job 成功时**才执行。构建失败（比如链接错误）时缓存不会被保存——
      # 于是每次重跑都要从零重编全部 vcpkg 依赖（本项目实测 124 个库），
      # 而失败时恰恰是最需要快速重试的时候。
      #
      # 分离写法可以在失败时也保存：vcpkg 按包增量写入，已编好的包全都有效。

      - name: 恢复 ccache
        uses: actions/cache/restore@v4
        id: ccache
        with:
          path: ~/.cache/ccache
          key: ccache-engine-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-engine-${{ github.ref }}-
            ccache-engine-

      - name: 恢复 vcpkg 二进制缓存
        # key 含 manifest / overlay port / triplet / 构建类型，任一变化即失效重建。
        # vcpkg 本体钉在固定 commit（见 scripts/build_engine_android.sh），
        # ABI 稳定缓存才真正复用。
        uses: actions/cache/restore@v4
        id: vcpkg
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-android-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/**') }}-${{ env.BUILD_TYPE }}
          restore-keys: |
            vcpkg-android-

      # ---------------------------------------------------------------------
      # 依赖与引擎编译**分开两步**。CMake configure 会触发 vcpkg 安装全部 manifest
      # 依赖（本项目 124 个库），是整条链路里最慢的一步；引擎自身编译只有几分钟。
      #
      # 拆开的收益：
      #   1. 依赖一编完就落缓存，不必等引擎编译结束——引擎若失败或 runner 超时，
      #      那 124 个库就白编了（这是之前最大的时间浪费）。
      #   2. 失败归因清晰：是"装依赖"挂了还是"编引擎"挂了，一眼能看出。
      # ---------------------------------------------------------------------

      - name: 装依赖（CMake configure，触发 vcpkg）
        # VCPKG_BINARY_SOURCES 必须在这里 export，不能放进 env: 块——
        # GitHub Actions 的 env: 值是字面量，$HOME 不会被 shell 展开，
        # vcpkg 会因为路径不是绝对路径而直接报错退出。
        run: |
          export VCPKG_BINARY_SOURCES="clear;files,$HOME/.cache/vcpkg,readwrite"
          ./build.sh "$BUILD_TYPE" --engine-only --configure-only

      - name: 保存 vcpkg 二进制缓存
        # 紧跟在依赖装完之后，**在引擎编译之前**。if: always() 让依赖编到一半
        # 失败时也能存下已完成的部分——vcpkg 按包增量写入，已好的包全都有效。
        #
        # key 末尾必须带 run_id：actions/cache/save 在 key 已存在时会**直接失败**。
        # 用固定 key 的后果是——第一次保存成功之后，后续运行虽然恢复了旧缓存、
        # 也补编了新包，却因为 key 撞车而**存不进去**，缓存永远停在第一次的内容。
        # 表现就是某个包（比如首轮因缺 nasm 而失败的 ffmpeg）每轮都要重编。
        # 带 run_id 让每轮写新条目，restore-keys 的宽前缀负责命中最近一份。
        if: ${{ always() && steps.vcpkg.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-android-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/**') }}-${{ env.BUILD_TYPE }}-${{ github.run_id }}

      - name: 构建引擎
        # 上一步已完成 configure，这里会跳过 configure 直接编译。
        #
        # 仍要 export VCPKG_BINARY_SOURCES：`cmake --build` 在检测到 CMakeLists
        # 等输入变化时会重新触发 configure，而 configure 会再次调用 vcpkg。
        # 那时若没有二进制缓存源，vcpkg 会退回默认源并可能重编依赖——白白浪费
        # 掉上一步刚缓存好的成果。
        run: |
          export VCPKG_BINARY_SOURCES="clear;files,$HOME/.cache/vcpkg,readwrite"
          ./build.sh "$BUILD_TYPE" --engine-only

      - name: 诊断：vcpkg 二进制缓存体积与归档数
        # GitHub 每个仓库的 cache 总配额 10 GB，超出按 LRU 淘汰；淘汰掉旧条目会
        # 让下一轮又从缺包开始编。本轮会写两个 vcpkg 条目（configure 后 / 构建后），
        # 把体积和归档数打出来，逼近配额时能及早看见，而不是等"又开始重编 ffmpeg"
        # 这种症状出现再去猜。
        # 归档数 ≈ 已缓存住的目标数，也是"到底缺多少包"最直接的量化。
        if: ${{ always() }}
        run: |
          du -sh "$HOME/.cache/vcpkg" 2>/dev/null || echo "(缓存目录不存在)"
          printf "二进制缓存归档数: %s\n" "$(find "$HOME/.cache/vcpkg" -maxdepth 1 -name '*.zip' 2>/dev/null | wc -l)"

      - name: 保存 vcpkg 二进制缓存（构建之后）
        # **第二个** vcpkg 保存点，位置在「构建引擎」之后。第一个保存在 configure
        # 之后（见上），只覆盖那一轮 configure 装完的包。
        #
        # 为什么必须有第二个：vcpkg 是按包增量写缓存的，失败就停在当前进度。
        # 而构建引擎这一步会再跑一次 configure（环境里有 ENABLE_RENDER_PROBE /
        # KRKR_LOG_LEVEL，脚本每次都重新 configure），vcpkg 就在**这一步**把上一轮
        # 没装完的包补齐——那些包正是在这里现编的。如果只有 configure 之后那一个
        # 保存点，它们永远不会被写进缓存：下一轮恢复出来还是缺它们，于是在构建
        # 引擎这一步再编一遍。表现就是「每次都要重新编译剩余的库」、ffmpeg 每轮
        # 重编。
        #
        # 放在这里 + if: always() 后，即使这一轮编译仍然失败，本轮编好的包也会
        # 落进缓存，下一轮少编一批，逐轮收敛。configure 之后那个保存点保留：它
        # 防的是超时/取消——job 被 timeout 掐掉时，它后面的步骤根本不会执行。
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-android-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/**') }}-${{ env.BUILD_TYPE }}-${{ github.run_id }}-post-build

      - name: 保存 ccache
        # if: always() —— 编译失败也要存。ccache 内容寻址，已编译对象依然有效。
        # key 带 run_id 的原因同 vcpkg：固定 key 第二次保存会撞车失败。
        # 同一提交被重跑时 github.sha 不变，只靠 sha 不足以区分。
        if: ${{ always() && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-engine-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}

      - name: 诊断：GLES3 符号来源（仅构建失败时输出）
        # 用于定位 EGL/GLESv2 链接类问题。两件事必须区分清楚：
        #   (a) NDK 的 libGLESv2 stub 里到底有没有这些 ES3 符号
        #   (b) -lGLESv2 有没有真的出现在最终的链接命令里
        # 两者对应完全不同的修法，猜错会白烧一轮 CI。
        if: failure()
        run: |
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          STUB="$SYSROOT/usr/lib/aarch64-linux-android/24/libGLESv2.so"
          echo "===== (a) NDK stub: $STUB ====="
          ls -l "$STUB" 2>/dev/null || echo "  **该路径不存在**"
          if [ -f "$STUB" ]; then
            for s in glGetStringi glBlitFramebuffer glMapBufferRange glUnmapBuffer glGetString; do
              printf "  %-22s " "$s"
              if "$NM" -D --defined-only "$STUB" 2>/dev/null | grep -q " $s\$"; then
                echo "导出"
              else
                echo "**未导出**"
              fi
            done
          fi
          echo
          echo "===== (b) 链接命令行里是否有 -lGLESv2 / -lEGL ====="
          NINJA="out/android/$BUILD_TYPE/build.ninja"
          if [ -f "$NINJA" ]; then
            for l in GLESv2 EGL; do
              printf "  -l%-10s 出现 %s 次\n" "$l" "$(grep -c -- "-l$l" "$NINJA" || true)"
            done
            echo "  --- engine_api 链接行中的库（节选） ---"
            grep -o -- '-l[A-Za-z0-9_+.-]*' "$NINJA" | sort -u | tr '\n' ' ' | head -c 2000
            echo
          else
            echo "  找不到 $NINJA（configure 未完成？）"
          fi
          echo
          echo "===== (c) vcpkg_installed 里各 triplet 有什么 ====="
          # configure 期的 find_package 失败常源于「找到的是宿主 triplet 的包」，
          # 而不是目标 triplet 的。列出各自的 share/ 目录能一眼看出目标包在不在。
          VI="out/android/$BUILD_TYPE/vcpkg_installed"
          if [ -d "$VI" ]; then
            for t in "$VI"/*/; do
              echo "  $(basename "$t"): $(ls "$t/share" 2>/dev/null | wc -l) 个包"
              ls "$t/share" 2>/dev/null | grep -iE "opencv|openmp" | sed 's/^/      /' || true
            done
            echo "  --- 目标 triplet 下是否有 opencv4 ---"
            ls -d "$VI"/arm64-android/share/opencv4 2>/dev/null || echo "      **没有**（find_package 会退回到宿主 triplet）"
          else
            echo "  找不到 $VI"
          fi

      - name: 校验 libengine_api.so
        # 第三个参数传 jniLibs：顺带断言运行时依赖（libomp.so 等）确实和引擎放在
        # 一起了。少了这一步，问题只会在装机后以"游戏启动即崩溃"暴露。
        #
        # EXPECT_LIVE2D：还原过 Cubism SDK 的轮次里，二进制**必须**含 Live2D 插件。
        # 缺 SDK 时降级是允许的，但"以为有 Live2D、其实 CMake 静默跳过"绝不能算通过。
        env:
          EXPECT_LIVE2D: ${{ steps.cubism.outputs.live2d }}
        run: |
          scripts/verify_engine_so.sh \
            "out/android/$BUILD_TYPE/bridge/engine_api/libengine_api.so" \
            "$ANDROID_NDK_HOME" \
            "app/app/src/main/jniLibs/arm64-v8a"

      - name: 记录体积
        run: |
          SO="out/android/$BUILD_TYPE/bridge/engine_api/libengine_api.so"
          ls -lh "$SO"
          echo "engine_so_bytes=$(stat -c%s "$SO")" >> "$GITHUB_OUTPUT"
        id: size

      - name: 上传引擎产物
        # 上传**整个 jniLibs/arm64-v8a 目录**，不是只传 libengine_api.so。
        #
        # build_engine_android.sh 会把 libengine_api.so 的 DT_NEEDED 里那些
        # 平台不提供的运行时库（典型是 libomp.so，用 c++_shared 时还有
        # libc++_shared.so）一并拷进这个目录。它们必须跟着引擎一起进 APK，
        # 否则真机 dlopen 会直接失败：
        #   dlopen failed: library "libomp.so" not found: needed by libengine_api.so
        # 而 APK job 是独立 job、全新 checkout，只拿得到这里上传的东西——
        # 之前只传单个 .so，那些运行时库就永远到不了 APK。
        uses: actions/upload-artifact@v4
        with:
          name: libengine_api-${{ env.BUILD_TYPE }}
          path: app/app/src/main/jniLibs/arm64-v8a/
          if-no-files-found: error

  # ── APK：把引擎产物放进 jniLibs 后由 Gradle 打包 ──────────────────────────
  android-package:
    name: 打包 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: engine-build
    env:
      BUILD_TYPE: ${{ inputs.build_type != '' && inputs.build_type || 'debug' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 下载引擎产物
        uses: actions/download-artifact@v4
        with:
          name: libengine_api-${{ env.BUILD_TYPE }}
          path: app/app/src/main/jniLibs/arm64-v8a/

      - name: 安装 Android platform 36
        # compileSdk 36 是 compose 1.12 / foundation 1.13 的硬要求（低于它会直接
        # 报 "dependency requires compileSdk 36"），而托管 runner 预装的 platform
        # 未必到 36，这里显式装一次并接受许可。
        run: |
          SDKMGR=""
          for c in "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager \
                   "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
                   "$ANDROID_HOME"/tools/bin/sdkmanager; do
            [ -x "$c" ] && SDKMGR="$c" && break
          done
          [ -n "$SDKMGR" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-36"
          fi
          echo "platforms: $(ls "$ANDROID_HOME/platforms")"

      - name: Setup Gradle
        # 版本必须 ≥ 8.13：AGP 8.13 依赖 Gradle 里被 9.6 移除的内部 API，且
        # 低于 8.13 会直接报 "Minimum supported Gradle version"。
        # 与 gradle/wrapper/gradle-wrapper.properties 钉的版本保持一致。
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - name: 构建 APK
        working-directory: app
        run: gradle --no-daemon ":app:assemble$([ "$BUILD_TYPE" = release ] && echo Release || echo Debug)"

      - name: 校验 APK 内含引擎库（逐个核对 jniLibs）
        # 不能只查 libengine_api.so 在不在：它的运行时依赖（libomp.so 等）如果
        # 没进 APK，真机 dlopen 会在加载引擎时就失败，表现成"游戏启动即崩溃"。
        # 这里拿 jniLibs 里的**全部** .so 去 APK 里逐个核对，多一个少一个都报出来。
        run: |
          APK="$(find app/app/build/outputs/apk -name '*.apk' | head -n1)"
          [ -n "$APK" ] || { echo "::error::未产出 APK"; exit 1; }
          UNZIP_LIST="$(unzip -l "$APK")"
          missing=0
          while IFS= read -r so; do
            name="$(basename "$so")"
            if ! grep -q "lib/arm64-v8a/$name" <<<"$UNZIP_LIST"; then
              echo "::error::APK 中缺少 lib/arm64-v8a/$name"
              missing=1
            fi
          done < <(find app/app/src/main/jniLibs/arm64-v8a -name '*.so')
          if (( missing )); then
            echo "jniLibs 内容："; ls -l app/app/src/main/jniLibs/arm64-v8a/
            echo "APK 内的 lib/arm64-v8a："
            grep "lib/arm64-v8a/" <<<"$UNZIP_LIST" || true
            exit 1
          fi
          echo "jniLibs 里的 .so 全部在 APK 中："
          find app/app/src/main/jniLibs/arm64-v8a -name '*.so' -printf '  %f\n'
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: KrKr2Next-apk-${{ env.BUILD_TYPE }}
          path: app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
