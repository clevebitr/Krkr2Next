name: Android 构建

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（debug / release）'
        type: choice
        default: debug
        options:
          - debug
          - release
      enable_render_probe:
        description: '开启统一诊断探针总开关（默认关闭，见 docs/dev/probes.md）'
        type: boolean
        default: false
      log_level:
        description: '引擎日志级别（auto=按构建类型：release→info，debug→debug）'
        type: choice
        default: auto
        options:
          - auto
          - trace
          - debug
          - info
          - warn
          - err
          - critical
          - off
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 锁 NDK 27：托管 runner 预装更新的 NDK，而 libffi:arm64-android 在 NDK 29 下
  # 交叉编译失败。这里显式指定，避免 sdkmanager 装到不兼容版本。
  NDK_VERSION: '27.0.12077973'
  JOBS: 4

jobs:
  # ── 引擎：先出 libengine_api.so 并做符号断言 ──────────────────────────────
  # 独立成 job 是为了让引擎侧问题（符号缺失、依赖错、残留 ANGLE）在 Gradle
  # 之前就失败，反馈更快，也避免把 Gradle 的问题和引擎的问题混在一起。
  engine-build:
    name: 构建引擎 (libengine_api.so)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TYPE: ${{ inputs.build_type != '' && inputs.build_type || 'debug' }}
      ENABLE_RENDER_PROBE: ${{ inputs.enable_render_probe != '' && inputs.enable_render_probe || 'false' }}
      KRKR_LOG_LEVEL: ${{ inputs.log_level != '' && inputs.log_level || 'auto' }}

    steps:
      - uses: actions/checkout@v4

      - name: 静态检查
        # JNI 符号一致性 / 移植溯源漂移 / 本地语法检查。都不需要 NDK，
        # 秒级出结果，因此放在最前面——这类问题（符号不一致、断言写错）
        # 只在运行时暴露，让它们在编译之前就失败。
        run: bash scripts/check_static.sh

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装构建依赖
        run: |
          # runner 预装的 chrome apt 源与本次构建无关，且其 dl.google.com CDN
          # 偶发 Hash Sum mismatch 会让 apt-get update 退出 100 拖垮整个 workflow。
          # 按内容删除所有指向 dl.google.com 的源，只保留 ubuntu 官方源。
          sudo grep -rIl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null | \
            xargs -r sudo rm -f
          sudo apt-get update -o Acquire::Retries=3 || true
          # autoconf/automake/libtool：vcpkg 的 autotools 端口需要宿主 autoreconf
          sudo apt-get install -y cmake ninja-build ccache autoconf automake libtool
          cmake --version | head -1
          # 打印绝对路径：构建 preset 用 Ninja 生成器，找不到 ninja 时
          # CMake 只报 "CMAKE_MAKE_PROGRAM is not set"，看不出是安装问题还是 PATH 问题
          echo "ninja: $(command -v ninja)"
          ninja --version

      - name: 安装 Android NDK ${{ env.NDK_VERSION }}
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            SDKMGR=""
            for c in "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager \
                     "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
                     "$ANDROID_HOME"/tools/bin/sdkmanager; do
              if [ -x "$c" ]; then SDKMGR="$c"; break; fi
            done
            [ -n "$SDKMGR" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "ndk;$NDK_VERSION"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_HOME/ndk/$NDK_VERSION"

      # 缓存必须用 restore/save 分离 + save 加 if: always()。
      #
      # 合并式的 actions/cache@v4 把保存放在 job 末尾的 post 步骤，而那一步只在
      # **job 成功时**才执行。构建失败（比如链接错误）时缓存不会被保存——
      # 于是每次重跑都要从零重编全部 vcpkg 依赖（本项目实测 124 个库），
      # 而失败时恰恰是最需要快速重试的时候。
      #
      # 分离写法可以在失败时也保存：vcpkg 按包增量写入，已编好的包全都有效。

      - name: 恢复 ccache
        uses: actions/cache/restore@v4
        id: ccache
        with:
          path: ~/.cache/ccache
          key: ccache-engine-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-engine-${{ github.ref }}-
            ccache-engine-

      - name: 恢复 vcpkg 二进制缓存
        # key 含 manifest / overlay port / triplet / 构建类型，任一变化即失效重建。
        # vcpkg 本体钉在固定 commit（见 scripts/build_engine_android.sh），
        # ABI 稳定缓存才真正复用。
        uses: actions/cache/restore@v4
        id: vcpkg
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-android-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/**') }}-${{ env.BUILD_TYPE }}
          restore-keys: |
            vcpkg-android-

      # ---------------------------------------------------------------------
      # 依赖与引擎编译**分开两步**。CMake configure 会触发 vcpkg 安装全部 manifest
      # 依赖（本项目 124 个库），是整条链路里最慢的一步；引擎自身编译只有几分钟。
      #
      # 拆开的收益：
      #   1. 依赖一编完就落缓存，不必等引擎编译结束——引擎若失败或 runner 超时，
      #      那 124 个库就白编了（这是之前最大的时间浪费）。
      #   2. 失败归因清晰：是"装依赖"挂了还是"编引擎"挂了，一眼能看出。
      # ---------------------------------------------------------------------

      - name: 装依赖（CMake configure，触发 vcpkg）
        # VCPKG_BINARY_SOURCES 必须在这里 export，不能放进 env: 块——
        # GitHub Actions 的 env: 值是字面量，$HOME 不会被 shell 展开，
        # vcpkg 会因为路径不是绝对路径而直接报错退出。
        run: |
          export VCPKG_BINARY_SOURCES="clear;files,$HOME/.cache/vcpkg,readwrite"
          ./build.sh "$BUILD_TYPE" --engine-only --configure-only

      - name: 保存 vcpkg 二进制缓存
        # 紧跟在依赖装完之后，**在引擎编译之前**。if: always() 让依赖编到一半
        # 失败时也能存下已完成的部分——vcpkg 按包增量写入，已好的包全都有效。
        if: ${{ always() && steps.vcpkg.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-android-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/**') }}-${{ env.BUILD_TYPE }}

      - name: 构建引擎
        # 上一步已完成 configure，这里会跳过 configure 直接编译。
        run: ./build.sh "$BUILD_TYPE" --engine-only

      - name: 保存 ccache
        # if: always() —— 编译失败也要存。ccache 内容寻址，已编译对象依然有效。
        if: ${{ always() && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-engine-${{ github.ref }}-${{ github.sha }}

      - name: 诊断：GLES3 符号来源（仅构建失败时输出）
        # 用于定位 EGL/GLESv2 链接类问题。两件事必须区分清楚：
        #   (a) NDK 的 libGLESv2 stub 里到底有没有这些 ES3 符号
        #   (b) -lGLESv2 有没有真的出现在最终的链接命令里
        # 两者对应完全不同的修法，猜错会白烧一轮 CI。
        if: failure()
        run: |
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          STUB="$SYSROOT/usr/lib/aarch64-linux-android/24/libGLESv2.so"
          echo "===== (a) NDK stub: $STUB ====="
          ls -l "$STUB" 2>/dev/null || echo "  **该路径不存在**"
          if [ -f "$STUB" ]; then
            for s in glGetStringi glBlitFramebuffer glMapBufferRange glUnmapBuffer glGetString; do
              printf "  %-22s " "$s"
              if "$NM" -D --defined-only "$STUB" 2>/dev/null | grep -q " $s\$"; then
                echo "导出"
              else
                echo "**未导出**"
              fi
            done
          fi
          echo
          echo "===== (b) 链接命令行里是否有 -lGLESv2 / -lEGL ====="
          NINJA="out/android/$BUILD_TYPE/build.ninja"
          if [ -f "$NINJA" ]; then
            for l in GLESv2 EGL; do
              printf "  -l%-10s 出现 %s 次\n" "$l" "$(grep -c -- "-l$l" "$NINJA" || true)"
            done
            echo "  --- engine_api 链接行中的库（节选） ---"
            grep -o -- '-l[A-Za-z0-9_+.-]*' "$NINJA" | sort -u | tr '\n' ' ' | head -c 2000
            echo
          else
            echo "  找不到 $NINJA（configure 未完成？）"
          fi

      - name: 校验 libengine_api.so
        run: scripts/verify_engine_so.sh "out/android/$BUILD_TYPE/bridge/engine_api/libengine_api.so" "$ANDROID_NDK_HOME"

      - name: 记录体积
        run: |
          SO="out/android/$BUILD_TYPE/bridge/engine_api/libengine_api.so"
          ls -lh "$SO"
          echo "engine_so_bytes=$(stat -c%s "$SO")" >> "$GITHUB_OUTPUT"
        id: size

      - name: 上传引擎产物
        uses: actions/upload-artifact@v4
        with:
          name: libengine_api-${{ env.BUILD_TYPE }}
          path: out/android/${{ env.BUILD_TYPE }}/bridge/engine_api/libengine_api.so
          if-no-files-found: error

  # ── APK：把引擎产物放进 jniLibs 后由 Gradle 打包 ──────────────────────────
  android-package:
    name: 打包 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: engine-build
    env:
      BUILD_TYPE: ${{ inputs.build_type != '' && inputs.build_type || 'debug' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 下载引擎产物
        uses: actions/download-artifact@v4
        with:
          name: libengine_api-${{ env.BUILD_TYPE }}
          path: app/app/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle
        # gradle-wrapper.jar 是二进制、未入库，所以 CI 里直接用 action 提供的
        # gradle，不走 ./gradlew。本地构建需要先跑一次
        # `cd app && gradle wrapper --gradle-version 8.11.1`。
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 构建 APK
        working-directory: app
        run: gradle --no-daemon ":app:assemble$([ "$BUILD_TYPE" = release ] && echo Release || echo Debug)"

      - name: 校验 APK 内含引擎库
        run: |
          APK="$(find app/app/build/outputs/apk -name '*.apk' | head -n1)"
          [ -n "$APK" ] || { echo "::error::未产出 APK"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libengine_api.so' || {
            echo "::error::APK 中缺少 lib/arm64-v8a/libengine_api.so"; exit 1; }
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: KiriNext-apk-${{ env.BUILD_TYPE }}
          path: app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
