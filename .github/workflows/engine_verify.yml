name: 引擎核心验证 (Linux)

# 在 Ubuntu runner 上以宿主构建（非交叉编译）验证 C++ 引擎核心：
#   - 编译全部引擎库（engine_api SHARED + core + plugins + tools）
#   - 跑 tests/ 下的 Catch2 单元测试与 SIMD 逐像素比对（ctest）
#
# 这是**最快的正确性信号**：Linux 宿主构建无 NDK 开销，配合 vcpkg 二进制缓存 +
# ccache，常规改动 5-10 分钟出结果，且与 Android 的 SIMD/算法结论等价
# （公式缺陷与指令集无关）。因此它对 push/PR 自动运行——不能自动跑的测试
# 等于没有测试。
#
# 与 android_build.yml 的分工：那边验证 Android 交叉编译与 APK 打包，
# 这边验证引擎的行为正确性。两者都用 push/PR 触发。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: engine-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux:
    name: Build engine core + smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      JOBS: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 静态检查
        # 不需要任何依赖，秒级出结果，放在装依赖之前
        run: bash scripts/check_static.sh

      - name: Install build dependencies
        # bison: 生成 TJS2 parser
        # libegl1-mesa-dev / libgles2-mesa-dev: 引擎已去掉 ANGLE，直连平台原生
        #   EGL/GLES；Linux 宿主构建需要这两个库来满足 -lEGL -lGLESv2。
        # yasm: vcpkg ffmpeg 3.3.9 在 x86_64 下优先用 yasm（configure 先查 yasm 再退回 nasm）
        #       apt 的 nasm 2.15 生成的 .d 依赖会把 %include 写成裸文件名，导致
        #       "No rule to make target 'vp9itxfm_template.asm'"；yasm 则生成正确路径。
        run: |
          # runner 的 chrome apt 源文件名不固定，用 grep 按内容删除所有指向
          # dl.google.com 的源，避免其 CDN 偶发 Hash Sum mismatch 使 apt-get update
          # 退出 100 拖垮 workflow；update 再做重试+兜底。
          sudo grep -rIl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null | \
            xargs -r sudo rm -f
          sudo apt-get update -o Acquire::Retries=3 || true
          # libomp-dev：根 CMakeLists 有 find_package(OpenMP REQUIRED)，
          #   OpenCV 的配置也会 find_dependency(OpenMP)。CMake 用 clang 时靠 libomp。
          sudo apt-get install -y cmake ninja-build ccache bison nasm yasm \
            libegl1-mesa-dev libgles2-mesa-dev libomp-dev
          cmake --version | head -1
          ninja --version
          bison --version | head -1

      - name: GL/EGL 符号可用性
        # 必须在装完依赖之后：本检查要对着平台的 libGLESv2/libEGL 校验代码里
        # 直接调用的 GL 函数。放在"静态检查"那一步（装依赖之前）会永远跳过，
        # 而最后还打印"全部通过"——那是假信心。
        #
        # 这里校验的是 **Linux 宿主目标**（Mesa 的库）。Android 目标由本机
        # Termux 直接跑同一脚本校验（那里是真正的 /system/lib64/libGLESv2.so）。
        run: python3 scripts/check_gl_symbols.py

      - name: Restore ccache
        uses: actions/cache/restore@v4
        id: ccache
        with:
          path: ~/.cache/ccache
          key: ccache-linux-core-${{ github.ref }}
          restore-keys: |
            ccache-linux-core-

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        id: vcpkg
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}
          restore-keys: |
            vcpkg-linux-

      - name: Configure + build engine core (Linux host)
        run: |
          export VCPKG_BINARY_SOURCES="files,${HOME}/.cache/vcpkg,readwrite"
          export CCACHE_DIR="${HOME}/.cache/ccache"
          # vcpkg 自举（与 build/*.sh 相同的路径约定）。固定到同一 commit，
          # 避免每次全新 runner 拉最新 vcpkg 造成 ABI 漂移、vcpkg 缓存失效全量重编。
          # Pin vcpkg to the same commit so the ABI stays stable and the binary
          # cache is reusable (see build/build_android.sh VCPKG_PINNED_COMMIT).
          if [ ! -d ".devtools/vcpkg/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git .devtools/vcpkg
            (cd .devtools/vcpkg && git checkout --detach 52d80838fb40c755b1615fbc9c7b994a33742a22 && ./bootstrap-vcpkg.sh -disableMetrics)
          fi
          export VCPKG_ROOT="$PWD/.devtools/vcpkg"
          cmake --preset "Linux Debug Config"
          cmake --build --preset "Linux Debug Build" -- -j"$JOBS"

      - name: Save ccache
        # build 失败也保存（ccache 内容寻址，已编译对象依然有效）——用官方推荐的显式 save，
        # 不再依赖已废弃且不可靠的 save-always。
        # key 带 run_id：actions/cache/save 在 key 已存在时会失败，固定 key 会让
        # 第一次之后的保存全部落空，缓存永远停在初次内容。
        if: ${{ always() && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-core-${{ github.ref }}-${{ github.run_id }}

      - name: Save vcpkg binary cache
        # build 失败也保存（vcpkg 按包增量写入，已编译完的包仍然有效）。
        # key 带 run_id 的原因同 ccache：固定 key 会让保存撞车失败。
        if: ${{ always() && steps.vcpkg.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}-${{ github.run_id }}

      - name: Run tests (ctest)
        run: |
          # --no-tests=error：测试目录存在却没有注册到任何用例，属于配置错误
          # （例如 find_package(Catch2) 没找到、catch_discover_tests 漏调），
          # 必须失败而不是静默通过——否则测试被悄悄摘掉也不会有人发现。
          (cd out/linux/debug && ctest --output-on-failure --no-tests=error)

      - name: Smoke test tools/xp3
        run: |
          # xp3 目标设了 CMAKE_RUNTIME_OUTPUT_DIRECTORY=tools/bin/dbg，不在 out/ 下
          XP3_BIN="tools/bin/dbg/xp3"
          if [ -x "$XP3_BIN" ]; then
            "$XP3_BIN" --help >/dev/null 2>&1 && echo "tools/xp3 smoke test OK"
          else
            echo "tools/xp3 not built — skipping"
          fi

      - name: Report engine_api artifact
        run: |
          ls -lh out/linux/debug/bridge/engine_api/ || true
